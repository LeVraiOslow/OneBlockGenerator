name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Verifier les jars de libs/
        run: |
          # Vault, SuperiorSkyblock2 et PlaceholderAPI sont attendus dans libs/ (voir build.gradle.kts)
          if ! ls libs/*.jar >/dev/null 2>&1; then
            echo "::error::Aucun jar dans libs/ : ajoute Vault, SuperiorSkyblock2 et PlaceholderAPI (et retire libs/ du .gitignore)."
            exit 1
          fi

      - name: Build
        run: gradle build --no-daemon

      - name: Publier le jar
        uses: actions/upload-artifact@v4
        with:
          name: ObGenerator
          path: build/libs/*.jar
          if-no-files-found: error
