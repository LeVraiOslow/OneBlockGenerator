# Une entrée = un générateur. Ajoute autant de fichiers .yml que tu veux dans ce dossier.
#
# name            nom de l'item et de l'hologramme
# ingredient      ressource placee 8 fois autour du Moteur : STONE, nexo:mon_item, spawner:ZOMBIE
#                 Pour un autre motif :
#                   recipe:
#                     shape: ["ABA", "BMB", "ABA"]
#                     ingredients: {A: DIAMOND, B: nexo:mon_item, M: engine}
# block           bloc pose : STONE ou nexo:mon_bloc (les meubles Nexo ne sont pas geres)
# item            item en main, par défaut le même que block
# unlock-price    prix du déverrouillage
# cost-multiplier multiplie les couts en monnaie de profiles.yml
# upgrade-item    remplace {product} dans les exigences d'amélioration
# profile         progression dans profiles.yml (défaut : standard)
# menu            menu dans menus.yml (défaut : default)
# permission      permission pour le fabriquer
# production
#   items         items produits par cycle au niveau 1
#   mobs          mobs apparaissant à chaque cycle
#   money         monnaie par cycle au niveau 1
#   xp            points d'XP par cycle au niveau 1
#   commands      commandes console à chaque cycle ({owner}, {level})
#   delivery      STORAGE (défaut, à récupérer) ou DROP (items au sol)
# hologram        lignes propres : locked, running, full, upgrading
# levels          remplace des valeurs du profil pour ce générateur :
#   levels:
#     10:
#       interval: 10s
#       items: {STONE: 50, COBBLESTONE: 10}
#       money-value: 500
#       upgrade:
#         duration: 2d
#         requirements:
#           special: {type: ITEM, item: nexo:cle_rare, amount: 1}

