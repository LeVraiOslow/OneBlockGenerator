# Progression partagee par les générateurs. Un générateur la choisit avec "profile: standard"
# et peut remplacer n'importe quelle valeur dans sa section "levels" (voir generators/blocs.yml).
#
# interval : temps entre deux cycles
# amount   : multiplicateur des items et mobs produits
# money    : multiplicateur de la monnaie
# xp       : multiplicateur de l'XP
# capacity : stock maximum (items, ou cycles pour un générateur sans item)
#
# Exigences d'amélioration, stockees sous upgrade.requirements :
#   type ITEM        : item, amount. {product} = ressource du générateur, {ingredient} = ressource de son craft
#                      Accepte aussi nexo:mon_item, spawner:ZOMBIE et engine (le Moteur)
#   type MONEY       : amount, multiplie par cost-multiplier du générateur
#   type XP          : amount en niveaux
#   type PLAYTIME    : amount en duree (non consomme)
#   type STATISTIC   : statistic (MOB_KILLS, ...), amount (non consomme)
#   type PERMISSION  : permission
#   type PLACEHOLDER : placeholder (%...%), amount
# Options : slot, label, scale (multiplie aussi par cost-multiplier), icon (material, name, lore).
profiles:
  standard:
    levels:
      1: {interval: 60s, amount: 1, money: 1, xp: 1, capacity: 128}
      2:
        interval: 55s
        amount: 2
        money: 2
        xp: 2
        capacity: 256
        upgrade:
          duration: 5m
          requirements:
            ressource: {type: ITEM, item: "{product}", amount: 128, scale: false}
            moteur: {type: ITEM, item: engine, amount: 1}
            monnaie: {type: MONEY, amount: 250000}
            xp: {type: XP, amount: 100}
            temps: {type: PLAYTIME, amount: 20h}
